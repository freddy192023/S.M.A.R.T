spring:
  application:
    name: smart-messaging

  # ── Base de Datos Cloud (Supabase PostgreSQL) para Idempotencia y Auditoría (Doc 3.3.3 & Bloque 2.2) ──
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres.tjemmhsqfltplgvglfmy}
    password: ${SPRING_DATASOURCE_PASSWORD:6Fh3ItJOpov8yAqT}

  # ── Configuración RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    host: shark.rmq.cloudamqp.com
    port: 5671
    username: upzhvdpi
    password: uQeQBUACo1mXOIuYq2Rta87dczLjEkHa
    virtual-host: upzhvdpi
    ssl:
      enabled: true

    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-interval: 30000
        multiplier: 2.0

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0
          max-attempts: 3

  # ── Configuración Apache Kafka (Bloques 4.1 y 4.6) ───────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # Productor: Serialización String para claves y JSON para objetos DTO
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true

    # Consumidor: Deserialización con ErrorHandlingDeserializer y control de offsets
    consumer:
      group-id: smart-messaging-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.smart.messaging.dto,*"

    # Listener: Control de entrega y tolerancia a tópicos ausentes
    listener:
      ack-mode: record
      missing-topics-fatal: false

server:
  port: 8080

# ── Logging con Correlation ID y MDC (Documento 3.3.3) ────────────────────────
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) [CorrId: %clr(%X{correlationId:-NONE}){cyan}] %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"
  level:
    com.smart.messaging: DEBUG
    org.springframework.amqp: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
